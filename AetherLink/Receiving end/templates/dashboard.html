<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AetherLink — Control Room</title>
<style>
  :root {
    --bg-1: #cfd8e3;
    --bg-2: #dbe4ee;
    --panel: #e7edf3;
    --panel-header: #dde5ee;
    --border: #c3cedb;
    --text: #33383e;
    --muted: #6b7480;
    --accent: #4f9eff;

    --high: #ff5d5d;
    --high-bg: #ffe3e3;
    --medium: #e8a53d;
    --medium-bg: #fbecd3;
    --low: #4f9eff;
    --low-bg: #dfeaff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 10% 90%, rgba(120,170,230,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 95% 10%, rgba(150,190,235,0.25), transparent 60%),
      var(--bg-1);
    background-attachment: fixed;
    color: var(--text);
    padding: 28px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.2px;
    font-weight: 800;
    color: var(--text);
  }
  .brand-text .subtitle {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 8px rgba(63,185,80,0.6);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    align-items: start;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .column-header {
    background: var(--panel-header);
    padding: 13px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--text);
  }
  .column-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 999px;
  }
  .column-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 40px;
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--low);
    border-radius: 10px;
    padding: 13px 14px;
  }
  .card.priority-high { border-left-color: var(--high); }
  .card.priority-medium { border-left-color: var(--medium); }
  .card.priority-low { border-left-color: var(--low); }

  .card.status-attended {
    opacity: 0.55;
    border-left-color: var(--border) !important;
  }
  .card.status-attended .badge {
    filter: grayscale(0.6);
  }

  .card.card-enter {
    animation: fadein 0.4s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .badge {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.3px;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge.priority-high { color: #b23434; background: var(--high-bg); }
  .badge.priority-medium { color: #97671c; background: var(--medium-bg); }
  .badge.priority-low { color: #2d6fc9; background: var(--low-bg); }

  .card-time {
    font-size: 11px;
    color: var(--muted);
  }
  .card-text {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 9px;
    line-height: 1.45;
  }
  .card-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .card-meta span {
    background: #f2f5f9;
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 6px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .card-actions button {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #f7f9fb;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .card-actions button:hover {
    background: #eef2f6;
  }
  .btn-attend.is-attended {
    background: #e4f5e8;
    border-color: #b9e3c3;
    color: #227a3d;
  }
  .btn-delete {
    color: #b23434;
  }
  .btn-delete:hover {
    background: #ffe9e9;
  }
  .empty-board {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: var(--panel);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#33383e" stroke-width="7">
        <circle cx="35" cy="35" r="16"/>
        <circle cx="65" cy="35" r="16"/>
        <circle cx="35" cy="65" r="16"/>
        <circle cx="65" cy="65" r="16"/>
      </g>
    </svg>
    <div class="brand-text">
      <h1>AetherLink</h1>
      <div class="subtitle">Decentralized off-grid mesh intelligence — control room</div>
    </div>
  </div>
  <div class="status"><span class="dot"></span><span id="count">0 alerts</span></div>
</header>

<div class="board" id="board"></div>

<script>
  const PRIORITY_ORDER = { "HIGH": 0, "MEDIUM": 1, "LOW": 2 };
  let knownIds = new Set();

  function priorityRank(p) {
    const key = (p || "").toUpperCase();
    return PRIORITY_ORDER.hasOwnProperty(key) ? PRIORITY_ORDER[key] : 3;
  }

  function priorityClass(p) {
    const key = (p || "").toUpperCase();
    if (key === "HIGH") return "priority-high";
    if (key === "MEDIUM") return "priority-medium";
    return "priority-low";
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function cardHtml(a) {
    const p = a.payload || {};
    const pClass = priorityClass(p.priority);
    const attended = a.status === 'attended';
    return `
      <div class="card-top">
        <span class="badge ${pClass}">${escapeHtml(p.priority || 'UNKNOWN')}</span>
        <span class="card-time">${new Date(a.received_at).toLocaleTimeString()}</span>
      </div>
      <div class="card-text">${p.raw_text ? escapeHtml(p.raw_text) : '<em>No message text</em>'}</div>
      <div class="card-meta">
        <span>📍 ${escapeHtml(p.location || 'unknown')}</span>
        <span>🆘 ${escapeHtml(p.need || 'unknown')}</span>
      </div>
      <div class="card-actions">
        <button class="btn-attend ${attended ? 'is-attended' : ''}" data-action="toggle-attend" data-id="${a.record_id}" data-current="${a.status || 'new'}">
          ${attended ? '✓ Attended' : 'Mark Attended'}
        </button>
        <button class="btn-delete" data-action="delete" data-id="${a.record_id}">
          Delete
        </button>
      </div>
    `;
  }

  async function toggleAttend(recordId, currentStatus) {
    const newStatus = currentStatus === 'attended' ? 'new' : 'attended';
    try {
      await fetch(`/api/alerts/${recordId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
    } catch (e) {
      console.error('Failed to update status', e);
    }
  }

  async function deleteAlert(recordId) {
    if (!confirm('Delete this alert permanently?')) return;
    try {
      await fetch(`/api/alerts/${recordId}`, { method: 'DELETE' });
    } catch (e) {
      console.error('Failed to delete', e);
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if (action === 'toggle-attend') {
      toggleAttend(id, btn.dataset.current);
    } else if (action === 'delete') {
      deleteAlert(id);
    }
  });

  async function poll() {
    try {
      const res = await fetch('/api/alerts');
      const alerts = await res.json();
      render(alerts);
    } catch (e) {
      console.error('Poll failed', e);
    }
    setTimeout(poll, 2000);
  }

  function render(alerts) {
    document.getElementById('count').textContent =
      alerts.length + (alerts.length === 1 ? ' alert' : ' alerts');

    const board = document.getElementById('board');

    if (alerts.length === 0) {
      if (!board.querySelector('.empty-board')) {
        board.innerHTML = '<div class="empty-board">Waiting for incoming alerts...</div>';
      }
      return;
    }

    // Group by category
    const groups = {};
    alerts.forEach(a => {
      const payload = a.payload || {};
      const category = (payload.category || "UNCATEGORIZED").toUpperCase();
      if (!groups[category]) groups[category] = [];
      groups[category].push(a);
    });

    Object.keys(groups).forEach(cat => {
      groups[cat].sort((a, b) => {
        const aAttended = a.status === 'attended' ? 1 : 0;
        const bAttended = b.status === 'attended' ? 1 : 0;
        if (aAttended !== bAttended) return aAttended - bAttended; // non-attended first
        const pa = priorityRank((a.payload || {}).priority);
        const pb = priorityRank((b.payload || {}).priority);
        if (pa !== pb) return pa - pb;
        return new Date(b.received_at) - new Date(a.received_at);
      });
    });

    const sortedCategories = Object.keys(groups).sort();

    // Remove stale empty-board placeholder if present
    const placeholder = board.querySelector('.empty-board');
    if (placeholder) placeholder.remove();

    // Track which columns should exist
    const existingColumns = {};
    board.querySelectorAll('.column').forEach(col => {
      existingColumns[col.dataset.category] = col;
    });

    sortedCategories.forEach((cat, index) => {
      let column = existingColumns[cat];
      let body;

      if (!column) {
        column = document.createElement('div');
        column.className = 'column';
        column.dataset.category = cat;
        column.innerHTML = `
          <div class="column-header">
            <span>${escapeHtml(cat)}</span>
            <span class="column-count"></span>
          </div>
          <div class="column-body"></div>
        `;
        board.appendChild(column);
      } else {
        delete existingColumns[cat];
      }

      // Keep column order matching sortedCategories
      board.appendChild(column);

      column.querySelector('.column-count').textContent = groups[cat].length;
      body = column.querySelector('.column-body');

      const items = groups[cat];
      const existingCards = {};
      body.querySelectorAll('.card').forEach(c => {
        existingCards[c.dataset.recordId] = c;
      });

      items.forEach(a => {
        let card = existingCards[a.record_id];
        const pClass = priorityClass((a.payload || {}).priority);
        const attendedClass = a.status === 'attended' ? 'status-attended' : '';
        const signature = `${a.status || 'new'}`;

        if (!card) {
          card = document.createElement('div');
          card.className = `card ${pClass} ${attendedClass} card-enter`;
          card.dataset.recordId = a.record_id;
          card.dataset.signature = signature;
          card.innerHTML = cardHtml(a);
        } else {
          delete existingCards[a.record_id];
          card.className = `card ${pClass} ${attendedClass}`;
          // Only re-render inner content if status actually changed (avoids wiping hover/focus state needlessly)
          if (card.dataset.signature !== signature) {
            card.dataset.signature = signature;
            card.innerHTML = cardHtml(a);
          }
        }
        body.appendChild(card); // re-append preserves/sets order without recreating DOM
      });

      // Remove cards no longer present in this category
      Object.values(existingCards).forEach(c => c.remove());
    });

    // Remove columns for categories that no longer have any alerts
    Object.values(existingColumns).forEach(col => col.remove());
  }

  poll();
</script>

</body>
</html>
